<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B4D8F">
<title>Calendar — Driver Runs office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="../assets/admin.css">
<style>
  .cal{display:grid; grid-template-columns:repeat(7,1fr)}
  .cal .dow{font-family:"Archivo",sans-serif; font-size:10.5px; font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--ink-3); padding:9px 10px; background:var(--surface-2);
    border-bottom:1.5px solid var(--line); text-align:left}
  .cell{min-height:92px; border-right:1.5px solid var(--line); border-bottom:1.5px solid var(--line);
    padding:8px 9px; background:none; text-align:left; display:flex; flex-direction:column; gap:5px}
  .cell:nth-child(7n+7){border-right:0}
  .cell:hover{background:var(--surface-2)}
  .cell.out{background:var(--surface-2); opacity:.5}
  .cell.today{box-shadow:inset 0 0 0 2px var(--accent-line)}
  .cell[aria-current="true"]{background:var(--accent-soft); box-shadow:inset 0 0 0 2px var(--accent)}
  .cell .dnum{font-family:"Archivo",sans-serif; font-size:14px; font-weight:700}
  .cell.out .dnum{font-weight:500; color:var(--ink-3)}
  .cell .norun{font-family:"Archivo",sans-serif; font-size:9.5px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; color:var(--issue); background:var(--issue-soft);
    border:1.5px solid var(--issue-line); border-radius:3px; padding:1px 5px; align-self:flex-start}
  .cell .runs{display:flex; flex-direction:column; gap:3px; margin-top:auto}
  .cell .rrow{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-2)}
  .cell .dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--line-2)}
  .cell .dot.part{background:var(--flag)} .cell .dot.full{background:var(--done)}
  .cell .dot.cx{background:var(--issue)}
  .monthbar{display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1.5px solid var(--line)}
  .monthbar h3{font-size:17px; font-weight:700; min-width:180px}
  .viewtog{display:flex; margin-left:auto; border:1.5px solid var(--line-2); border-radius:var(--r); overflow:hidden}
  .vt{padding:7px 14px; font-family:"Archivo",sans-serif; font-size:13px; font-weight:700;
    color:var(--ink-3); border-right:1.5px solid var(--line-2)}
  .vt:last-child{border-right:0}
  .vt[aria-pressed="true"]{background:var(--ink); color:var(--ground)}
  .cal.wk .cell{min-height:190px}
  .navbtn{padding:7px 13px; border:1.5px solid var(--line-2); border-radius:var(--r);
    font-family:"Archivo",sans-serif; font-size:13px; font-weight:700}
  .navbtn:hover{border-color:var(--accent); color:var(--accent)}
  .dayrun{border-bottom:1.5px solid var(--line)}
  .dayrun:last-child{border-bottom:0}
  .runhdr{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center;
    padding:14px 20px; background:var(--surface-2); border-bottom:1.5px solid var(--line)}
  .runhdr h4{font-family:"Archivo",sans-serif; font-size:15.5px; font-weight:700}
  .runhdr .meta{font-size:13px; color:var(--ink-2)}
  .runhdr select{padding:7px 10px; border:1.5px solid var(--line-2); border-radius:var(--r);
    background:var(--surface); font-size:14px}
  .runhdr .sp{margin-left:auto; display:flex; gap:8px}
  .srow{display:grid; grid-template-columns:26px 1fr auto auto auto; gap:10px; align-items:center;
    padding:9px 20px; border-bottom:1px dashed var(--line); font-size:14.5px}
  .srow:last-child{border-bottom:0}
  .srow.skipped{opacity:.45}
  .srow .n{font-family:"Archivo",sans-serif; font-size:11.5px; font-weight:700; color:var(--ink-3)}
  .srow .who{font-size:12.5px}
  .srow select{padding:5px 8px; border:1.5px solid var(--line-2); border-radius:4px;
    background:var(--surface); font-size:12.5px; max-width:130px}
  .srow .st{font-family:"Archivo",sans-serif; font-size:10px; font-weight:700; letter-spacing:.06em;
    text-transform:uppercase; padding:2px 6px; border-radius:3px; border:1.5px solid; white-space:nowrap}
  .st.done{color:var(--done); background:var(--done-soft); border-color:var(--done)}
  .st.issue{color:var(--issue); background:var(--issue-soft); border-color:var(--issue-line)}
  .st.pending{color:var(--ink-3); background:var(--surface-3); border-color:var(--line-2)}
  .st.skipped{color:var(--ink-3); background:var(--surface-3); border-color:var(--line-2)}
  .st.marker{color:var(--accent); background:var(--accent-soft); border-color:var(--accent-line)}
  .srow .tools{display:flex; gap:3px}
  .srow .tool{width:24px; height:24px; border-radius:4px; border:1.5px solid var(--line-2);
    display:grid; place-items:center; font-size:12px; color:var(--ink-3)}
  .srow .tool:hover{border-color:var(--accent); color:var(--accent)}
  .adhoc{padding:12px 20px; background:var(--surface-2); display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .adhoc .oc{background:var(--surface); border:1.5px solid var(--line-2); border-radius:20px;
    padding:6px 12px; font-size:12.5px; font-weight:600}
  .adhoc .oc:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
  .holidaybar{display:flex; flex-wrap:wrap; gap:9px; align-items:end; padding:14px 20px;
    background:var(--surface-2); border-bottom:1.5px solid var(--line)}
  .holidaybar label{display:block; font-family:"Archivo",sans-serif; font-size:10px; font-weight:700;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-bottom:4px}
  .holidaybar input, .holidaybar select{padding:9px 11px; border:1.5px solid var(--line-2);
    border-radius:var(--r); background:var(--surface); font-size:14.5px}
  .modal{position:fixed; inset:0; background:rgba(8,14,20,.5); display:grid; place-items:center; z-index:20; padding:20px}
  .card{background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); width:100%; max-width:460px; padding:22px}
  .card h3{font-size:18px; font-weight:700; margin-bottom:4px}
  .card input{width:100%; padding:11px; border:1.5px solid var(--line-2); border-radius:var(--r);
    background:var(--surface-2); font-size:15px; margin-top:10px}
  .picks{max-height:210px; overflow-y:auto; border:1.5px solid var(--line); border-radius:var(--r); margin-top:8px}
  .pick{display:block; width:100%; text-align:left; padding:9px 12px; border-bottom:1.5px solid var(--line); background:none; font-size:14px}
  .pick:hover{background:var(--accent-soft)}
  .pick small{display:block; color:var(--ink-3)}
  .cardacts{display:grid; grid-template-columns:1fr 1.4fr; gap:9px; margin-top:16px}
</style>
</head>
<body class="admin">
<div id="root"></div>

<script type="module">
import { auth, db, rpcAdmin, esc, hhmm, clock, longDate, todayISO, nav, wireNav, mountLogin, access }
  from '../assets/admin.js';

const root = document.getElementById('root');
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const REASONS = { nobody_home:'Nobody home', nothing_ready:'Nothing ready', other:'Something else' };

let business = null, routes = [], drivers = [], customers = [], onCall = [];
let view = localStorage.getItem('mdc.calview') || 'month';   // month | week | day
let month = todayISO().slice(0, 7);
let anchor = todayISO();                                     // week/day cursor
let days = [], exceptions = [];
let open = null, dayData = null, err = '', busy = false;
let hol = { label:'', scope:'' };
let modal = null;                                  // { runDayId, q }

function renderLogin() { mountLogin(root, boot); }

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const monthName = m => new Date(m + '-01T00:00:00').toLocaleDateString('en-AU', { month:'long', year:'numeric' });

function gridDates() {
  let start, len;
  if (view === 'week') {
    const a = new Date(anchor + 'T00:00:00');
    start = new Date(a);
    start.setDate(a.getDate() - ((a.getDay() + 6) % 7));      // back to Monday
    len = 7;
  } else {
    const first = new Date(month + '-01T00:00:00');
    start = new Date(first);
    start.setDate(1 - ((first.getDay() + 6) % 7));
    len = 42;
  }
  return Array.from({ length: len }, (_, i) => {
    const d = new Date(start); d.setDate(start.getDate() + i); return d;
  });
}

function periodLabel() {
  if (view === 'month') return monthName(month);
  if (view === 'day')   return longDate(anchor);
  const g = gridDates();
  const a = g[0], b = g[6];
  const same = a.getMonth() === b.getMonth();
  return `${a.getDate()} ${same ? '' : a.toLocaleDateString('en-AU',{month:'short'}) + ' '}` +
         `&ndash; ${b.getDate()} ${b.toLocaleDateString('en-AU',{month:'short', year:'numeric'})}`;
}

/* ── month ───────────────────────────────────────────────────────────────── */

async function loadMonth() {
  const all = gridDates();
  days = await db(`run_days?service_date=gte.${iso(all[0])}&service_date=lte.${iso(all[41])}` +
    `&select=id,service_date,status,route_id,routes(name),run_stops(status,tickable)&order=service_date.asc`);
  exceptions = await db(`calendar_exceptions?exception_date=gte.${iso(all[0])}` +
    `&exception_date=lte.${iso(all[41])}&select=id,exception_date,route_id,action,label`);
}

function cellHTML(d) {
  const key = iso(d);
  const outside = view === 'month' && key.slice(0,7) !== month;
  const noRun = exceptions.find(e => e.exception_date === key && e.action === 'no_run');
  const mine = days.filter(x => x.service_date === key);
  return `<button class="cell ${outside?'out':''} ${key===todayISO()?'today':''}"
                  data-day="${key}" aria-current="${open === key}">
    <span class="dnum">${d.getDate()}</span>
    ${noRun ? `<span class="norun">${esc(noRun.label || 'no run')}</span>` : ''}
    <span class="runs">${mine.map(r => {
      const s = (r.run_stops || []).filter(x => x.tickable && x.status !== 'skipped');
      const settled = s.filter(x => x.status === 'done' || x.status === 'issue').length;
      const cls = r.status === 'cancelled' ? 'cx' : (s.length && settled === s.length) ? 'full' : settled ? 'part' : '';
      return `<span class="rrow"><span class="dot ${cls}"></span>${esc(r.routes ? r.routes.name : '')}</span>`;
    }).join('')}</span>
  </button>`;
}

/* ── one day, editable ───────────────────────────────────────────────────── */

async function loadDay(date) {
  for (const r of routes) {
    try { await rpcAdmin('ensure_run_day', { p_route_id: r.id, p_service_date: date }); } catch {}
  }
  dayData = await db(`run_days?service_date=eq.${date}` +
    `&select=id,status,cancel_reason,driver_id,route_id,routes(name,start_time),` +
    `run_stops(id,seq,kind,status,tickable,origin,customer_id,customer_name,label,loaded_at,` +
    `marked_at,issue_reason,issue_note,scheduled_time,assigned_driver_id,skipped_reason,` +
    `customers(name,suburb))&order=service_date.asc`);
}

function stopRow(r, s) {
  const name = s.customer_name || (s.customers && s.customers.name) || s.label || '';
  const settled = s.status === 'done' || s.status === 'issue';
  const cls = s.status === 'skipped' ? 'skipped' : !s.tickable ? 'marker' : s.status;
  const label = s.status === 'issue' ? (REASONS[s.issue_reason] || 'issue')
              : !s.tickable ? 'note' : s.status;
  return `<div class="srow ${s.status === 'skipped' ? 'skipped' : ''}">
    <span class="n num">${s.seq}</span>
    <span>${esc(name)}${s.origin === 'adhoc' ? ' <span class="badge">added today</span>' : ''}
      ${s.issue_note ? `<br><small style="color:var(--issue)">&ldquo;${esc(s.issue_note)}&rdquo;</small>` : ''}
      ${s.skipped_reason ? `<br><small>${esc(s.skipped_reason)}</small>` : ''}</span>
    <span class="who">${s.tickable && s.status !== 'skipped' ? `
      <select data-assign="${s.id}" title="Who does this stop">
        <option value="">${esc(driverName(r.driver_id) || 'run driver')}</option>
        ${drivers.filter(d => d.is_active).map(d =>
          `<option value="${d.id}" ${s.assigned_driver_id === d.id ? 'selected' : ''}>${esc(d.display_name)}</option>`).join('')}
      </select>` : ''}</span>
    <span class="st ${cls}">${esc(label)}</span>
    <span class="tools">
      ${s.status !== 'skipped' && !settled ? `
        <button class="tool" data-up="${s.id}" title="Move up">&uarr;</button>
        <button class="tool" data-down="${s.id}" title="Move down">&darr;</button>
        <button class="tool" data-skip="${s.id}" title="Take off today">&times;</button>` : ''}
      ${s.status === 'skipped' ? `<button class="tool" data-unskip="${s.id}" title="Put back">&#8630;</button>` : ''}
      ${settled ? `<span class="who">${clock(s.marked_at)}</span>` : ''}
    </span>
  </div>`;
}

const driverName = id => (drivers.find(d => d.id === id) || {}).display_name || '';

function dayHTML() {
  if (!open) return '';
  const noRun = exceptions.find(e => e.exception_date === open && e.action === 'no_run');

  return `<div class="panel">
    <header>
      <div><h2>${longDate(open)}</h2>
        <span class="when">Changes here affect this day only. The weekly pattern is untouched.</span></div>
      <button class="navbtn" id="closeday">Close</button>
    </header>

    <div class="holidaybar">
      ${noRun
        ? `<div><b>Marked as no run${noRun.label ? ' — ' + esc(noRun.label) : ''}</b>
             ${noRun.route_id ? '<span class="badge">one run only</span>' : '<span class="badge">all runs</span>'}</div>
           <button class="navbtn" id="clearhol">Put the runs back on</button>`
        : `<div><label for="hlabel">Mark this day as no run</label>
             <input id="hlabel" placeholder="Melbourne Cup Day" value="${esc(hol.label)}"></div>
           <div><label for="hscope">Which runs</label>
             <select id="hscope"><option value="">Every run</option>
               ${routes.map(r => `<option value="${r.id}" ${hol.scope===r.id?'selected':''}>${esc(r.name)} only</option>`).join('')}
             </select></div>
           <button class="btn" id="sethol">Mark no run</button>`}
    </div>
    ${err ? `<p class="err" style="margin:14px 20px">${esc(err)}</p>` : ''}

    ${(dayData || []).length ? dayData.map(r => {
      const stops = (r.run_stops || []).slice().sort((a,b) => a.seq - b.seq);
      const live = stops.filter(s => s.status !== 'skipped' && s.tickable);
      const done = live.filter(s => s.status === 'done').length;
      const issue = live.filter(s => s.status === 'issue').length;
      return `<div class="dayrun">
        <div class="runhdr">
          <h4>${esc(r.routes ? r.routes.name : 'Run')}</h4>
          <select data-rundriver="${r.id}" title="Who drives this run today">
            <option value="">Nobody assigned</option>
            ${drivers.filter(d => d.is_active).map(d =>
              `<option value="${d.id}" ${r.driver_id === d.id ? 'selected' : ''}>${esc(d.display_name)}</option>`).join('')}
          </select>
          <span class="meta">${r.routes && r.routes.start_time ? hhmm(r.routes.start_time) + ' start &middot; ' : ''}${done} done, ${issue} issue, ${live.length-done-issue} to go
            ${r.status === 'cancelled' ? ' &middot; <b style="color:var(--issue)">cancelled</b>' : ''}</span>
          <span class="sp">
            ${r.status === 'cancelled'
              ? `<button class="navbtn" data-uncancel="${r.id}">Put this run back on</button>`
              : `<button class="navbtn" data-cancel="${r.id}">Cancel this run today</button>`}
          </span>
        </div>
        ${stops.length ? stops.map(s => stopRow(r, s)).join('')
                       : '<div class="empty" style="padding:16px">No stops on this run today.</div>'}
        <div class="adhoc">
          <button class="btn" data-add="${r.id}">+ Add a stop for today only</button>
          ${onCall.length ? `<span class="when">On call:</span>` : ''}
          ${onCall.slice(0, 8).map(c =>
            `<button class="oc" data-oc="${r.id}|${c.id}">+ ${esc(c.name)}</button>`).join('')}
        </div>
      </div>`;
    }).join('') : `<div class="empty">Nothing runs on this day.</div>`}
  </div>`;
}

/* ── day actions ─────────────────────────────────────────────────────────── */

async function act(fn) {
  if (busy) return;
  busy = true; err = '';
  try { await fn(); await loadDay(open); await loadMonth(); }
  catch (e) { err = e.message; }
  busy = false; render();
}

const setRunDriver = (id, v) => act(() =>
  db(`run_days?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ driver_id: v || null }) }));

// Doubling up: a per-stop field, never re-parenting rows between run days.
const setStopDriver = (id, v) => act(() =>
  db(`run_stops?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ assigned_driver_id: v || null }) }));

const cancelRun = (id, on) => act(() =>
  db(`run_days?id=eq.${id}`, { method:'PATCH', body: JSON.stringify(
    on ? { status:'cancelled', cancel_reason:'Cancelled by the office' }
       : { status:'planned', cancel_reason:null }) }));

// Removing a stop from one day is a SKIP, never a delete: a deleted
// template-sourced row would be resurrected by the next generation.
function skipStop(id) {
  const why = prompt('Why is this stop coming off today? (optional)') ?? '';
  act(() => db(`run_stops?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({
    status:'skipped', skipped_reason: why.trim() || 'Taken off by the office' }) }));
}
const unskipStop = id => act(() =>
  db(`run_stops?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ status:'pending', skipped_reason:null }) }));

function moveStop(id, dir) {
  const run = dayData.find(r => (r.run_stops || []).some(s => s.id === id));
  const list = run.run_stops.filter(s => s.status !== 'skipped').sort((a,b) => a.seq - b.seq);
  const i = list.findIndex(s => s.id === id);
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  act(async () => {
    for (let k = 0; k < list.length; k++) {
      const want = (k + 1) * 10;
      if (list[k].seq !== want) {
        await db(`run_stops?id=eq.${list[k].id}`, { method:'PATCH', body: JSON.stringify({ seq: want }) });
      }
    }
  });
}

function addAdhoc(runDayId, customerId) {
  const run = dayData.find(r => r.id === runDayId);
  const seq = (Math.max(0, ...(run.run_stops || []).map(s => s.seq)) + 10);
  return act(() => db('run_stops', { method:'POST', body: JSON.stringify({
    business_id: business.id, run_day_id: runDayId, customer_id: customerId,
    kind:'customer', tickable:true, origin:'adhoc', seq, status:'pending'
  })}));
}

/* ── holidays ────────────────────────────────────────────────────────────── */

function setHoliday() {
  return act(async () => {
    await db('calendar_exceptions', { method:'POST', body: JSON.stringify({
      business_id: business.id, exception_date: open,
      route_id: hol.scope || null, action:'no_run', label: hol.label.trim() || null }) });
    const scope = hol.scope ? `&route_id=eq.${hol.scope}` : '';
    await db(`run_days?service_date=eq.${open}${scope}`, { method:'PATCH',
      body: JSON.stringify({ status:'cancelled', cancel_reason: hol.label.trim() || 'No run' }) });
    hol = { label:'', scope:'' };
  });
}
function clearHoliday() {
  return act(async () => {
    await db(`calendar_exceptions?exception_date=eq.${open}`, { method:'DELETE' });
    await db(`run_days?service_date=eq.${open}&status=eq.cancelled`, { method:'PATCH',
      body: JSON.stringify({ status:'planned', cancel_reason:null }) });
  });
}

/* ── add-stop picker ─────────────────────────────────────────────────────── */

function modalHTML() {
  if (!modal) return '';
  const q = (modal.q || '').toLowerCase();
  const hits = customers.filter(c => (c.name + ' ' + (c.suburb || '')).toLowerCase().includes(q)).slice(0, 40);
  return `<div class="modal" id="bg"><div class="card">
    <h3>Add a stop for ${esc(longDate(open))}</h3>
    <p class="sub" style="margin:0">This day only. The weekly pattern is not changed.</p>
    <input id="mq" placeholder="Search customers&hellip;" value="${esc(modal.q || '')}">
    <div class="picks">
      ${hits.map(c => `<button class="pick" data-pick="${c.id}">${esc(c.name)}
        <small>${esc([c.address_line, c.suburb].filter(Boolean).join(', ') || 'No address')}</small></button>`).join('')
        || '<div class="empty" style="padding:16px">Nothing matches. Add them on the Customers page first.</div>'}
    </div>
    <div class="cardacts"><button class="ghostbtn" id="mcancel">Cancel</button><span></span></div>
  </div></div>`;
}

/* ── shell ───────────────────────────────────────────────────────────────── */

function render() {
  root.innerHTML = `${nav('calendar.html')}<div class="wrap">
    <div class="panel">
      <div class="monthbar">
        <button class="navbtn" id="prev">&larr;</button>
        <h3>${periodLabel()}</h3>
        <button class="navbtn" id="next">&rarr;</button>
        <span class="viewtog">
          ${['month','week','day'].map(v =>
            `<button class="vt" data-view="${v}" aria-pressed="${view === v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}
        </span>
        <button class="navbtn" id="thismonth">Today</button>
      </div>
      ${view === 'day' ? '' : `<div class="cal ${view === 'week' ? 'wk' : ''}">
        ${DOW.map(d => `<div class="dow">${d}</div>`).join('')}
        ${gridDates().map(cellHTML).join('')}
      </div>`}
    </div>
    ${dayHTML()}
  </div>${modalHTML()}`;

  wireNav();
  const $ = s => root.querySelector(s);
  $('#prev').addEventListener('click', () => shift(-1));
  $('#next').addEventListener('click', () => shift(1));
  $('#thismonth').addEventListener('click', () => {
    anchor = todayISO(); month = anchor.slice(0,7);
    if (view === 'day') return openDay(anchor, true);
    open = null; dayData = null; refresh();
  });
  root.querySelectorAll('[data-view]').forEach(b =>
    b.addEventListener('click', () => setView(b.dataset.view)));
  root.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => openDay(b.dataset.day)));

  const c = $('#closeday'); if (c) c.addEventListener('click', () => { open = null; dayData = null; render(); });
  const hl = $('#hlabel'); if (hl) hl.addEventListener('input', e => { hol.label = e.target.value; });
  const hs = $('#hscope'); if (hs) hs.addEventListener('change', e => { hol.scope = e.target.value; });
  const sh = $('#sethol'); if (sh) sh.addEventListener('click', setHoliday);
  const ch = $('#clearhol'); if (ch) ch.addEventListener('click', clearHoliday);

  root.querySelectorAll('[data-rundriver]').forEach(el =>
    el.addEventListener('change', e => setRunDriver(el.dataset.rundriver, e.target.value)));
  root.querySelectorAll('[data-assign]').forEach(el =>
    el.addEventListener('change', e => setStopDriver(el.dataset.assign, e.target.value)));
  root.querySelectorAll('[data-cancel]').forEach(b =>
    b.addEventListener('click', () => cancelRun(b.dataset.cancel, true)));
  root.querySelectorAll('[data-uncancel]').forEach(b =>
    b.addEventListener('click', () => cancelRun(b.dataset.uncancel, false)));
  root.querySelectorAll('[data-skip]').forEach(b => b.addEventListener('click', () => skipStop(b.dataset.skip)));
  root.querySelectorAll('[data-unskip]').forEach(b => b.addEventListener('click', () => unskipStop(b.dataset.unskip)));
  root.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => moveStop(b.dataset.up, -1)));
  root.querySelectorAll('[data-down]').forEach(b => b.addEventListener('click', () => moveStop(b.dataset.down, 1)));
  root.querySelectorAll('[data-add]').forEach(b =>
    b.addEventListener('click', () => { modal = { runDayId: b.dataset.add, q:'' }; render(); }));
  root.querySelectorAll('[data-oc]').forEach(b => b.addEventListener('click', () => {
    const [rd, cid] = b.dataset.oc.split('|'); addAdhoc(rd, cid);
  }));

  if (modal) {
    $('#bg').addEventListener('click', e => { if (e.target.id === 'bg') { modal = null; render(); } });
    $('#mcancel').addEventListener('click', () => { modal = null; render(); });
    $('#mq').addEventListener('input', e => { modal.q = e.target.value; render(); $('#mq').focus(); });
    root.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
      const rd = modal.runDayId; modal = null; addAdhoc(rd, b.dataset.pick);
    }));
  }
}

function shift(n) {
  if (view === 'month') {
    const d = new Date(month + '-01T00:00:00');
    d.setMonth(d.getMonth() + n);
    month = iso(d).slice(0,7);
    open = null; dayData = null;
    return refresh();
  }
  const d = new Date(anchor + 'T00:00:00');
  d.setDate(d.getDate() + (view === 'week' ? 7 * n : n));
  anchor = iso(d); month = anchor.slice(0,7);
  if (view === 'day') return openDay(anchor, true);
  open = null; dayData = null; refresh();
}

function setView(v) {
  view = v; localStorage.setItem('mdc.calview', v);
  if (v === 'day') { anchor = open || anchor; return openDay(anchor, true); }
  if (v === 'week') { anchor = open || anchor; }
  month = anchor.slice(0,7);
  refresh();
}

async function openDay(date, force) {
  if (open === date && !force && view !== 'day') { open = null; dayData = null; return render(); }
  open = date; anchor = date; dayData = null; err = ''; render();
  try { await loadDay(date); await loadMonth(); } catch (e) { err = e.message; }
  render();
}

async function refresh() {
  try {
    await loadMonth();
    if (view === 'day' && !dayData) { await loadDay(anchor); open = anchor; }
    render();
  }
  catch (e) {
    if (/Signed out/.test(e.message)) return renderLogin();
    root.innerHTML = `${nav('calendar.html')}<div class="wrap"><div class="panel"><div class="empty">${esc(e.message)}</div></div></div>`;
    wireNav();
  }
}

async function boot() {
  if (!auth.token) return renderLogin();
  try {
    await access();
    [business] = await db('businesses?select=id,slug,name&limit=1');
    routes = await db('routes?is_active=eq.true&select=id,name&order=sort_order.asc');
    drivers = await db('drivers?select=id,display_name,is_active&order=sort_order.asc');
    customers = await db('customers?archived_at=is.null&select=id,name,address_line,suburb&order=name.asc');
    const oc = await db('route_stops?frequency=eq.on_call&select=customer_id&active_to=is.null');
    const ids = [...new Set(oc.map(x => x.customer_id).filter(Boolean))];
    onCall = customers.filter(c => ids.includes(c.id));
    await refresh();
  } catch (e) {
    if (/Signed out/.test(e.message)) return renderLogin();
    root.innerHTML = `${nav('calendar.html')}<div class="wrap"><div class="panel"><div class="empty">${esc(e.message)}</div></div></div>`;
    wireNav();
  }
}

boot();
</script>
</body>
</html>
