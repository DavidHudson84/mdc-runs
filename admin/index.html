<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#114C9C">
<title>Today — Driver Runs office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="../assets/admin.css">
</head>
<body class="admin">
<div id="root"></div>

<script type="module">
import { auth, signIn, db, rpcAdmin, esc, hhmm, clock, longDate, todayISO, nav, wireNav, mountLogin, access }
  from '../assets/admin.js';

const root = document.getElementById('root');
const REASONS = { nobody_home:'Nobody home', nothing_ready:'Nothing ready', other:'Something else' };
let date = new URLSearchParams(location.search).get('date') || todayISO();
let error = '';
let poll = null;
let drivers = [], msgs = [], msgDraft = { to:'', body:'' }, business = null;

/* ── login ───────────────────────────────────────────────────────────────── */

function renderLogin() { mountLogin(root, boot); }

/* ── today ───────────────────────────────────────────────────────────────── */

async function loadBoard() {
  const runs = await db(
    `run_days?service_date=eq.${date}` +
    `&select=id,status,started_at,completed_at,cancel_reason,` +
    `routes(name,start_time),drivers(display_name),` +
    `run_stops(id,status,tickable,kind,customer_name,label,issue_reason,issue_note,marked_at)` +
    `&order=service_date.asc`);

  const logs = await db(
    `vehicle_logs?service_date=eq.${date}` +
    `&select=id,failed,skipped,skip_reason,answers,odometer_start,` +
    `vehicles(label,rego),drivers(display_name)`);

  const vans = await db(
    `vehicles?is_active=eq.true&select=id,label,rego,odometer,service_due_km,service_due_date,rego_expiry&order=label.asc`);

  // Monday of the week the viewed date falls in
  const d = new Date(date + 'T00:00:00');
  const monday = new Date(d); monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const wk = monday.toISOString().slice(0, 10);
  const weekChecks = await db(`vehicle_logs?service_date=gte.${wk}&service_date=lte.${date}` +
    `&skipped=eq.false&select=driver_id,service_date,answers,failed`);

  return { runs, logs, vans, weekChecks, weekStart: wk };
}

function issuesFrom(runs) {
  const out = [];
  runs.forEach(r => (r.run_stops || []).forEach(s => {
    if (s.status === 'issue') out.push({
      name: s.customer_name || s.label,
      reason: REASONS[s.issue_reason] || 'Issue',
      note: s.issue_note,
      at: s.marked_at,
      who: r.drivers && r.drivers.display_name
    });
  }));
  return out.sort((a, b) => String(a.at).localeCompare(String(b.at)));
}

function checkFlags(d) {
  const did = new Set((d.weekChecks || [])
    .filter(l => Array.isArray(l.answers) && l.answers.length)
    .map(l => l.driver_id));
  // only chase drivers who are actually rostered on this week
  const working = new Set((d.runs || []).map(r => r.driver_id).filter(Boolean));
  return drivers.filter(x => x.is_active && working.has(x.id) && !did.has(x.id))
                .map(x => `${x.display_name} has not done the weekly van check yet`);
}

function vanFlags(vans, logs) {
  const out = [];
  vans.forEach(v => {
    if (v.service_due_km != null && v.odometer != null && v.service_due_km - v.odometer <= 500)
      out.push(`${v.label} (${v.rego}) — service due in ${(v.service_due_km - v.odometer).toLocaleString('en-AU')} km`);
    if (v.service_due_date) {
      const days = Math.round((new Date(v.service_due_date) - new Date(date)) / 86400000);
      if (days <= 14) out.push(`${v.label} (${v.rego}) — service due ${days < 0 ? Math.abs(days) + ' days ago' : 'in ' + days + ' days'}`);
    }
    if (v.rego_expiry) {
      const days = Math.round((new Date(v.rego_expiry) - new Date(date)) / 86400000);
      if (days <= 30) out.push(`${v.label} (${v.rego}) — rego ${days < 0 ? 'expired' : 'expires in ' + days + ' days'}`);
    }
  });
  logs.filter(l => l.failed).forEach(l => {
    const bad = (l.answers || []).filter(a => a.ok === false)
      .map(a => `${a.label}${a.note ? ' — ' + a.note : ''}`).join('; ');
    out.push(`${l.vehicles ? l.vehicles.label : 'Van'} failed the pre-start check (${l.drivers ? l.drivers.display_name : '?'}): ${bad}`);
  });
  logs.filter(l => l.skipped).forEach(l => {
    out.push(`${l.drivers ? l.drivers.display_name : 'A driver'} skipped the pre-start check — “${l.skip_reason}”`);
  });
  return out;
}

function renderBoard(d) {
  const issues = issuesFrom(d.runs);
  const flags = [...checkFlags(d), ...vanFlags(d.vans, d.logs)];

  root.innerHTML = `
    ${nav('index.html')}
    <div class="wrap">
      <div class="panel">
        <header>
          <div><h2>Today</h2>
            <span class="when">${longDate(date)} &middot; refreshes every 30 seconds</span></div>
          <div class="datectl">
            <input type="date" id="date" value="${date}">
            <button class="btn" id="jump">Go</button>
          </div>
        </header>

        ${issues.length ? `<div class="alert"><h3>Needs a phone call</h3><ul>
          ${issues.map(i => `<li>
            <b>${esc(i.name)}</b> <span class="rsn">${esc(i.reason)}</span>
            <span class="t">${clock(i.at)}${i.who ? ' &middot; ' + esc(i.who) : ''}</span>
            ${i.note ? `<span class="nt">&ldquo;${esc(i.note)}&rdquo;</span>` : ''}
          </li>`).join('')}
        </ul></div>` : ''}

        ${flags.length ? `<div class="amber"><strong>Vans</strong>
          <ul>${flags.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>` : ''}

        ${d.runs.length ? `<div class="board">
          ${d.runs.map(r => {
            const stops = (r.run_stops || []).filter(s => s.tickable && s.status !== 'skipped');
            const done = stops.filter(s => s.status === 'done').length;
            const iss  = stops.filter(s => s.status === 'issue').length;
            const togo = stops.filter(s => s.status === 'pending').length;
            const last = stops.filter(s => s.marked_at).sort((a,b) => String(b.marked_at).localeCompare(String(a.marked_at)))[0];
            const log  = d.logs.find(l => l.drivers && r.drivers && l.drivers.display_name === r.drivers.display_name);
            const pct  = stops.length ? ((done + iss) / stops.length * 100).toFixed(1) : 0;
            return `<div class="col">
              <h3>${esc(r.routes ? r.routes.name : 'Route')}</h3>
              <p class="drv">${esc(r.drivers ? r.drivers.display_name : 'No driver assigned')}${
                r.routes && r.routes.start_time ? ' &middot; ' + hhmm(r.routes.start_time) + ' start' : ''}${
                log && log.vehicles ? ' &middot; ' + esc(log.vehicles.rego) : ''}</p>
              <div class="bar"><i style="width:${pct}%"></i></div>
              <div class="cnt">
                <div class="g ${done ? '' : 'zero'}"><b class="num">${done}</b>done</div>
                <div class="r ${iss ? '' : 'zero'}"><b class="num">${iss}</b>issue</div>
                <div class="${togo ? '' : 'zero'}"><b class="num">${togo}</b>to go</div>
              </div>
              <p class="last">${
                r.status === 'cancelled' ? 'Cancelled — ' + esc(r.cancel_reason || 'no run')
                : r.status === 'complete' ? 'Finished ' + clock(r.completed_at)
                : last ? 'Last tick ' + clock(last.marked_at) + ' — ' + esc(last.customer_name || last.label)
                : 'Not started'}</p>
            </div>`;
          }).join('')}
        </div>` : `<div class="empty">No runs generated for ${longDate(date)} yet.<br>
          They build themselves the moment a driver opens the app.</div>`}
      </div>

      <div class="panel">
        <header><div><h2>Message the drivers</h2>
          <span class="when">Shows on their run screen next time they look &mdash; not a notification.
            Use WhatsApp for anything urgent.</span></div></header>
        <div class="lookup" style="background:var(--surface)">
          <div><label for="mto">Who</label>
            <select id="mto"><option value="">Everyone</option>
              ${drivers.filter(x => x.is_active).map(x =>
                `<option value="${x.id}" ${msgDraft.to === x.id ? 'selected' : ''}>${esc(x.display_name)}</option>`).join('')}
            </select></div>
          <div style="grid-column:span 2"><label for="mbody">Message</label>
            <input id="mbody" placeholder="Extra pickup at Seddon on your way back"
                   value="${esc(msgDraft.body)}"></div>
          <div><button class="btn" id="msend" style="width:100%;padding:11px 0">Send</button></div>
        </div>
        ${msgs.length ? `<div class="tablewrap"><table>
          <thead><tr><th>Sent</th><th>To</th><th>Message</th><th>Seen</th></tr></thead>
          <tbody>${msgs.slice(0, 12).map(m => `<tr>
            <td class="dim">${esc(m.created_at.slice(0,10))} ${clock(m.created_at)}</td>
            <td class="nm">${esc(m.to)}</td>
            <td>${esc(m.body)}</td>
            <td class="dim">${(m.seen || []).length
              ? (m.seen || []).map(x => `${esc(x.driver)} ${clock(x.read_at)}${
                  x.reply ? ` &mdash; &ldquo;${esc(x.reply)}&rdquo;` : ''}`).join('<br>')
              : 'not yet'}</td>
          </tr>`).join('')}</tbody></table></div>` : ''}
      </div>
    </div>`;

  wireNav();
  const mt = root.querySelector('#mto');
  if (mt) mt.addEventListener('change', e => { msgDraft.to = e.target.value; });
  const mb = root.querySelector('#mbody');
  if (mb) mb.addEventListener('input', e => { msgDraft.body = e.target.value; });
  const ms = root.querySelector('#msend');
  if (ms) ms.addEventListener('click', sendMessage);

  root.querySelector('#jump').addEventListener('click', () => {
    date = root.querySelector('#date').value || todayISO();
    history.replaceState(null, '', `?date=${date}`);
    refresh();
  });
}

async function sendMessage() {
  const body = (msgDraft.body || '').trim();
  if (!body) return;
  try {
    await db('driver_messages', { method:'POST', body: JSON.stringify({
      business_id: business.id, driver_id: msgDraft.to || null, body }) });
    msgDraft = { to:'', body:'' };
    await refresh();
  } catch (e) { alert(e.message); }
}

async function refresh() {
  try {
    const d = await loadBoard();
    try { msgs = await rpcAdmin('admin_message_status', { p_business_id: business.id }); } catch {}
    renderBoard(d);
  }
  catch (err) {
    if (/Signed out/.test(err.message)) return renderLogin();
    root.innerHTML = `${nav('index.html')}<div class="wrap"><div class="panel">
      <div class="empty">${esc(err.message)}</div></div></div>`;
    wireNav();
  }
}

async function boot() {
  if (!auth.token) return renderLogin();
  await access();
  try {
    [business] = await db('businesses?select=id,slug,name&limit=1');
    drivers = await db('drivers?select=id,display_name,is_active&order=sort_order.asc');
  } catch (e) { if (/Signed out/.test(e.message)) return renderLogin(); }
  refresh();
  clearInterval(poll);
  poll = setInterval(() => { if (!document.hidden) refresh(); }, 30000);
}

boot();
</script>
</body>
</html>
