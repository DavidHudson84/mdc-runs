# ═══════════════════════════════════════════════════════════════════════════
# The daily run report email.
#
# Runs at 09:17 UTC, Monday to Saturday. That is 7:17pm in Melbourne in winter
# and 8:17pm in summer -- late enough that every run is off the road either
# way, so "still not finished" in the report means the driver really did
# forget to press Finish. GitHub only speaks UTC, so the hour drifts by one
# with daylight saving and nothing else changes.
#
# Seventeen minutes past, not on the hour, because GitHub delays scheduled
# workflows when its queue is busy and the top of every hour is the worst of
# it. The first scheduled report was due at 7pm and fired at 1:38am, six and
# a half hours late.
#
# That delay cannot be prevented, only survived: the script works out which
# day it is reporting on from the Melbourne clock, and treats a run before
# midday as a late report for the day before. So a delayed report is still
# the right day's report.
#
# To send a day by hand: Actions -> Daily run report -> Run workflow, and put
# a date in (or leave it blank for today).
#
# Two repository secrets make it work. Settings -> Secrets and variables ->
# Actions:
#   SUPABASE_SERVICE_KEY  the service key from the Supabase dashboard
#   RESEND_API_KEY        a sending key from resend.com
# Neither is ever written into the repo -- this repo is public.
# ═══════════════════════════════════════════════════════════════════════════

name: Daily run report

on:
  schedule:
    - cron: '17 9 * * 1-6'
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to report on (YYYY-MM-DD). Blank means today.'
        required: false
        type: string
      dry_run:
        description: 'Print it instead of sending it'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No npm install: the script uses nothing but what Node ships with.
      - name: Build and send the report
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM: ${{ vars.REPORT_FROM }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/daily-report.mjs ${{ inputs.date }}
